<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1080 567.5354"
     width="1080" height="568"
     role="img" aria-label="Ad Station animated owl logo">
  <title>Ad Station — Owl Mark</title>
  <defs>

    <!-- ── Glow filter ───────────────────────────────────── -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- ── Breathing / pulse animation ──────────────────── -->
    <style>
      .owl-root {
        transform-origin: 540px 350px;
        animation: breathe 5s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,100% { transform: scale(1.000) translateY(0px); }
        50%      { transform: scale(1.006) translateY(-3px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .owl-root { animation: none; }
      }
    </style>

  </defs>

  <g class="owl-root">

    <!-- ── Ambient glow behind owl ───────────────────────── -->
    <ellipse cx="534" cy="420" rx="500" ry="240"
             fill="#C02628" opacity="0.10" filter="url(#glow)"/>

    <!-- ════════════════════════════════════════════════════
         EYELIDS  —  rendered BEHIND the main path
         Open pos  cy=240  (hidden in red body above eye holes)
         Closed pos cy=452  (fills the eye holes)
         ════════════════════════════════════════════════════ -->

    <!-- LEFT eyelid -->
    <ellipse cx="328" cy="240" rx="208" ry="116" fill="#C02628">
      <animate attributeName="cy"
               values="240;240;452;452;240;240"
               keyTimes="0;0.6667;0.7167;0.7500;0.8333;1"
               dur="6s" repeatCount="indefinite"
               calcMode="spline"
               keySplines="0 0 1 1;
                            0.8 0 0.2 1;
                            0 0 1 1;
                            0.1 0.7 0.2 1;
                            0 0 1 1"/>
    </ellipse>

    <!-- RIGHT eyelid -->
    <ellipse cx="740" cy="240" rx="208" ry="116" fill="#C02628">
