name: Daily Backup

on:
  schedule:
    # Run daily at 2:00 AM UTC (4:00 AM Cairo time)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm install @aws-sdk/client-s3

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: ${{ secrets.BACKUP_S3_PREFIX || 'inventory-backups' }}
          VOLUME_PATH: /tmp/volume-images
        run: |
          # Download images from Railway volume via SSH (if available)
          # For now, we only backup the database
          npx ts-node scripts/backup.ts

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Backup failed! Check the logs above."
          # Add Slack/email notification here if needed
